# VTC-basic Routing Benchmark Configuration
endpoint: "${api_endpoint:-http://localhost:8888}"
api_key: "${api_key}"
target_model: "tinyllama"
client_pool_size: 64
output_token_limit: 64
streaming_enabled: true
time_scale: 1.0
timeout_second: 30.0
max_retries: 3

# Workload configuration
workload_type: "constant"
workload_file: "benchmarks/scenarios/gateway/vtc-basic-routing/workload/vtc_routing_workload.jsonl"
dataset_file: "benchmarks/scenarios/gateway/vtc-basic-routing/dataset/vtc_routing_dataset.jsonl"
client_output: "benchmarks/scenarios/gateway/vtc-basic-routing/results/client"
trace_output: "benchmarks/scenarios/gateway/vtc-basic-routing/results/trace"
interval_ms: 10
duration_ms: 300000  # 5 minutes
goodput_target: 0.95

# Dataset configuration
prompt_type: "sharegpt"
tokenizer: "tiktoken"
model_name: "tinyllama"

# Dataset configs
dataset_configs:
  sharegpt:
    target_dataset: "benchmarks/scenarios/gateway/vtc-basic-routing/dataset/ShareGPT_V3_unfiltered_cleaned_split.json"
  
  synthetic_multiturn:
    shared_prefix_length: 20
    prompt_length: 80
    prompt_std: 20
    num_turns: 2
    num_turns_std: 1
    num_sessions: 30
    num_sessions_std: 10

# Workload generator configuration
workload_configs:
  constant:
    target_qps: 5
    target_prompt_len: 80
    target_completion_len: 64
    max_concurrent_sessions: 5 